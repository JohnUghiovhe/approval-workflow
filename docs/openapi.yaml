openapi: 3.0.3

info:
  title: Approval Workflow Service API
  description: >
    REST API for the Approval Workflow Service. Requesters submit departmental
    requests; authorized reviewers approve, reject, or return them for
    correction. Every decision follows a valid state transition and is recorded
    in an append-only activity history so the lifecycle stays traceable.
  version: 1.0.0

# The served document always carries servers and info.version from the runtime
# (src/config/openapi.ts): version is read from package.json so the spec never
# drifts from the shipped build.

tags:
  - name: Requests
    description: Create, list, and view departmental requests
  - name: Decisions
    description: Reviewer decisions and requester resubmission
  - name: Comments
    description: Reviewer comments attached to requests
  - name: Activities
    description: Append-only audit trail for a request
  - name: Health
    description: Liveness and readiness probes

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: App-only report that never touches the database.
      operationId: liveness
      responses:
        '200':
          description: The process is alive and answering
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Reports healthy only when the database is reachable.
      operationId: readiness
      responses:
        '200':
          description: Service is ready to serve traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is degraded because the database is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/requests:
    post:
      tags: [Requests]
      summary: Create a request
      description: Creates a request in SUBMITTED state and records its submission activity.
      operationId: createRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestInput'
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Requests]
      summary: List requests
      description: Paginated list with an optional status filter.
      operationId: listRequests
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: Paginated list of requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRequestsResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/requests/{id}:
    get:
      tags: [Requests]
      summary: Retrieve a request
      description: Returns the request with its comments and activity history.
      operationId: getRequestById
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The request with its comments and activities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/requests/{id}/approve:
    post:
      tags: [Decisions]
      summary: Approve a request
      description: Reviewer-only. Takes no body.
      operationId: approveRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/requests/{id}/reject:
    post:
      tags: [Decisions]
      summary: Reject a request
      description: Reviewer-only terminal decision.
      operationId: rejectRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '200':
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/requests/{id}/return:
    post:
      tags: [Decisions]
      summary: Return a request for correction
      description: Reviewer-only. Puts the request back into SUBMITTED on resubmission.
      operationId: returnRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '200':
          description: Request returned for correction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/requests/{id}/resubmit:
    post:
      tags: [Decisions]
      summary: Resubmit a returned request
      description: Public. Only valid from RETURNED state.
      operationId: resubmitRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResubmitInput'
      responses:
        '200':
          description: Request resubmitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/requests/{id}/comments:
    post:
      tags: [Comments]
      summary: Add a comment
      description: Reviewer-only. Also records a COMMENT activity row.
      operationId: addComment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCommentInput'
      responses:
        '201':
          description: Comment added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/requests/{id}/activities:
    get:
      tags: [Activities]
      summary: List activity history
      description: Append-only audit trail for the request in creation order.
      operationId: listActivities
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Activity rows for the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitiesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Reviewer token. Authentication is mocked: the bearer token is the
        reviewer id, and the header must be present on reviewer-only
        endpoints.

  parameters:
    RequestId:
      name: id
      in: path
      required: true
      description: UUID of the request
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Page number, 1-based
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    StatusFilter:
      name: status
      in: query
      required: false
      description: Filter requests by status
      schema:
        $ref: '#/components/schemas/RequestStatus'

  responses:
    BadRequest:
      description: Malformed JSON body or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: A decision has already been recorded for this request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request payload, query, or params failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Request body exceeds the configured JSON size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RequestStatus:
      type: string
      enum: [SUBMITTED, APPROVED, REJECTED, RETURNED]

    ActivityAction:
      type: string
      enum: [SUBMISSION, APPROVAL, REJECTION, RETURN, RESUBMISSION, COMMENT]

    # The standard error envelope. errors carries per-field issues for
    # validation failures; requestId is the correlation id set by the logger.
    ErrorResponse:
      type: object
      required: [statusCode, message, code]
      properties:
        statusCode:
          type: integer
        message:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        requestId:
          type: string
          description: Correlation id attached by the request logger

    # The standard success envelope; data holds the payload specific to each
    # endpoint.
    ApiResponse:
      type: object
      required: [statusCode, message, data]
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data: {}

    CommentDto:
      type: object
      required: [id, requestId, reviewerId, reviewerName, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        reviewerId:
          type: string
          format: uuid
        reviewerName:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    ActivityDto:
      type: object
      required: [id, requestId, action, createdAt]
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        reviewerId:
          type: string
          format: uuid
          nullable: true
        action:
          $ref: '#/components/schemas/ActivityAction'
        fromStatus:
          $ref: '#/components/schemas/RequestStatus'
        toStatus:
          $ref: '#/components/schemas/RequestStatus'
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    RequestDto:
      type: object
      required:
        - id
        - title
        - description
        - department
        - requesterName
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        department:
          type: string
        requesterName:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentDto'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/ActivityDto'

    CreateRequestInput:
      type: object
      required: [title, department, requesterName]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        department:
          type: string
          minLength: 1
        requesterName:
          type: string
          minLength: 1

    DecisionInput:
      type: object
      properties:
        notes:
          type: string
          description: Optional notes explaining a reject or return

    ResubmitInput:
      type: object
      required: [requesterName]
      properties:
        requesterName:
          type: string
          minLength: 1

    AddCommentInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1

    LivenessCheck:
      type: object
      required: [status, timestamp, uptime, version]
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
        version:
          type: string

    HealthCheck:
      type: object
      required: [status, timestamp, uptime, version, checks]
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
        version:
          type: string
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [up, down]

    LivenessResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/LivenessCheck'

    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/HealthCheck'

    RequestResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/RequestDto'

    CommentResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/CommentDto'

    ActivitiesResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [activities]
              properties:
                activities:
                  type: array
                  items:
                    $ref: '#/components/schemas/ActivityDto'

    ListRequestsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [data, page, pageSize, total, totalPages]
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/RequestDto'
                page:
                  type: integer
                pageSize:
                  type: integer
                total:
                  type: integer
                totalPages:
                  type: integer
