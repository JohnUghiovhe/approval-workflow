        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Reviewer token. Authentication is mocked: the bearer token is the
        reviewer id, and the header must be present on reviewer-only endpoints.
        Request: `Authorization: Bearer <reviewer-uuid>`.

  parameters:
    RequestId:
      name: id
      in: path
      required: true
      description: UUID of the request
      schema:
        type: string
        format: uuid
      example: 050de558-2ec7-401f-8bc3-911ebecb6202
    Page:
      name: page
      in: query
      required: false
      description: Page number, 1-based
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      example: 10
    StatusFilter:
      name: status
      in: query
      required: false
      description: Filter requests by status
      schema:
        $ref: '#/components/schemas/RequestStatus'
      example: SUBMITTED

  responses:
    BadRequest:
      description: Malformed JSON body or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 400
            message: Request cannot transition to the requested state
            code: BAD_REQUEST
            requestId: 9e103d30-6990-4884-b48b-a5a53ad8777a
            errors:
              request_id: 050de558-2ec7-401f-8bc3-911ebecb6202
              current_status: APPROVED
              attempted_decision: approve
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            message: Missing or invalid authorization header
            code: UNAUTHORIZED
            requestId: 9e3b8335-96a6-4173-a42c-438e913cf692
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Request not found
            code: NOT_FOUND
            requestId: 0606124f-a362-4e0a-9973-7b9c3588fc29
            errors:
              request_id: 00000000-0000-0000-0000-000000000000
    Conflict:
      description: A decision has already been recorded for this request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 409
            message: A decision has already been recorded for this request
            code: CONFLICT
            requestId: 9f8e1d4c-2b3a-4c5d-8e6f-1a2b3c4d5e6f
            errors:
              request_id: 050de558-2ec7-401f-8bc3-911ebecb6202
              decision: approve
    ValidationError:
      description: Request payload, query, or params failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 422
            message: Validation failed
            code: VALIDATION_ERROR
            requestId: 2f5ae5a7-afbf-4ab1-82df-7f0fb5871554
            errors:
              - field: title
                message: 'Too small: expected string to have >=1 characters'
              - field: department
                message: 'Too small: expected string to have >=1 characters'
              - field: requesterName
                message: 'Too small: expected string to have >=1 characters'
    PayloadTooLarge:
      description: Request body exceeds the configured JSON size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 413
            message: Payload too large
            code: PAYLOAD_TOO_LARGE
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 429
            message: Too many requests, please try again later
            code: TOO_MANY_REQUESTS
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 500
            message: An unexpected error occurred
            code: INTERNAL
            requestId: 7c4a1e2f-9b8d-4a5c-8e7f-3f6a1b2c3d4e

  schemas:
    RequestStatus:
      type: string
      enum: [SUBMITTED, APPROVED, REJECTED, RETURNED]

    ActivityAction:
      type: string
      enum: [SUBMISSION, APPROVAL, REJECTION, RETURN, RESUBMISSION, COMMENT]

    # The standard error envelope. `errors` carries per-field issues as an array
    # for validation failures or the raw details object for business errors;
    # requestId is the correlation id set by the logger.
    ErrorResponse:
      type: object
      required: [statusCode, message, code]
      properties:
        statusCode:
          type: integer
          description: HTTP status of the response
        message:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Stable machine-readable error code for branching
          enum:
            [
              PAYLOAD_TOO_LARGE,
              BAD_REQUEST,
              UNAUTHORIZED,
              NOT_FOUND,
              CONFLICT,
              VALIDATION_ERROR,
              TOO_MANY_REQUESTS,
              REQUEST_TIMEOUT,
              DB_ERROR,
              INTERNAL,
            ]
        errors:
          description: Optional validation issues or business error details
          oneOf:
            - type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
            - type: object
              additionalProperties: true
        requestId:
          type: string
          description: Correlation id attached by the request logger

    # The standard success envelope; data holds the payload specific to each
    # endpoint.
    ApiResponse:
      type: object
      required: [statusCode, message, data]
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data: {}

    CommentDto:
      type: object
      required: [id, requestId, reviewerId, reviewerName, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        reviewerId:
          type: string
          format: uuid
        reviewerName:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    ActivityDto:
      type: object
      required:
        - id
        - requestId
        - reviewerId
        - action
        - fromStatus
        - toStatus
        - note
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        reviewerId:
          type: string
          format: uuid
          nullable: true
          description: Reviewer who acted; null for submission and resubmission
        action:
          $ref: '#/components/schemas/ActivityAction'
        fromStatus:
          allOf:
            - $ref: '#/components/schemas/RequestStatus'
          nullable: true
          description: Status before the action; null when there was none
        toStatus:
          allOf:
            - $ref: '#/components/schemas/RequestStatus'
          nullable: true
          description: Status after the action; null for comments
        note:
          type: string
          nullable: true
          description: Requester name, decision notes, or comment body
        createdAt:
          type: string
          format: date-time

    RequestDto:
      type: object
      required:
        - id
        - title
        - description
        - department
        - requesterName
        - status
        - createdAt
        - updatedAt
        - comments
        - activities
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          description: Empty string when the requester omitted it
        department:
          type: string
        requesterName:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentDto'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/ActivityDto'

    # A decision response extends the request with who decided, what was
    # decided, and when. reviewerId is null for resubmissions because the
    # requester, not a reviewer, performs them.
    DecisionDto:
      allOf:
        - $ref: '#/components/schemas/RequestDto'
        - type: object
          required: [decision, reviewerId, decidedAt]
          properties:
            decision:
              type: string
              enum: [approve, reject, return, resubmit]
            reviewerId:
              type: string
              format: uuid
              nullable: true
            decidedAt:
              type: string
              format: date-time

    CreateRequestInput:
      type: object
      required: [title, department, requesterName]
      properties:
        title:
          type: string
          minLength: 1
          example: Laptop upgrade for design team
        description:
          type: string
          example: >-
            Replace aging laptops for the design team with newer models to keep
            design tools performant.
        department:
          type: string
          minLength: 1
          example: Engineering
        requesterName:
          type: string
          minLength: 1
          example: Olu Smith

    DecisionInput:
      type: object
      properties:
        notes:
          type: string
          description: Optional notes explaining a reject or return
          example: Fix the details

    ResubmitInput:
      type: object
      required: [requesterName]
      properties:
        requesterName:
          type: string
          minLength: 1
          example: Kemi Alade

    AddCommentInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          example: Looks good, ship it

    LivenessCheck:
      type: object
      required: [status, timestamp, uptime, version]
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
        version:
          type: string

    HealthCheck:
      type: object
      required: [status, timestamp, uptime, version, checks]
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
        version:
          type: string
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: string
              enum: [up, down]

    LivenessResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/LivenessCheck'

    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/HealthCheck'

    RequestResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/RequestDto'

    DecisionResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DecisionDto'

    CommentResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/CommentDto'

    ActivitiesResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [activities]
              properties:
                activities:
                  type: array
                  items:
                    $ref: '#/components/schemas/ActivityDto'

    ListRequestsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [data, page, pageSize, total, totalPages]
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/RequestDto'
                page:
                  type: integer
                pageSize:
                  type: integer
                total:
                  type: integer
                totalPages:
                  type: integer
