openapi: 3.0.3

info:
  title: Approval Workflow Service API
  description: >
    REST API for the Approval Workflow Service. Requesters submit departmental
    requests; authorized reviewers approve, reject, or return them for
    correction. Every decision follows a valid state transition and is recorded
    in an append-only activity history so the lifecycle stays traceable.
  version: 1.0.0

# The served document always carries servers and info.version from the runtime
# (src/config/openapi.ts): version is read from package.json so the spec never
# drifts from the shipped build.

tags:
  - name: Requests
    description: Create, list, and view departmental requests
  - name: Decisions
    description: Reviewer decisions and requester resubmission
  - name: Comments
    description: Reviewer comments attached to requests
  - name: Activities
    description: Append-only audit trail for a request
  - name: Health
    description: Liveness and readiness probes

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: App-only report that never touches the database.
      operationId: liveness
      responses:
        '200':
          description: The process is alive and answering
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
              example:
                statusCode: 200
                message: Operation completed successfully
                data:
                  status: ok
                  timestamp: '2026-08-06T14:47:18.460Z'
                  uptime: 7.19
                  version: 1.0.0

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Reports healthy only when the database is reachable.
      operationId: readiness
      responses:
        '200':
          description: Service is ready to serve traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                statusCode: 200
                message: Operation completed successfully
                data:
                  status: healthy
                  timestamp: '2026-08-06T14:56:36.958Z'
                  uptime: 565.69
                  version: 1.0.0
                  checks:
                    database: up
        '503':
          description: Service is degraded because the database is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                statusCode: 503
                message: Operation completed successfully
                data:
                  status: degraded
                  timestamp: '2026-08-06T14:56:36.958Z'
                  uptime: 565.69
                  version: 1.0.0
                  checks:
                    database: down

  /api/requests:
    post:
      tags: [Requests]
      summary: Create a request
      description: >
        Creates a request in SUBMITTED state and records its submission activity
        in the same transaction. Public; no bearer token required.
      operationId: createRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestInput'
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
              example:
                statusCode: 201
                message: Request created successfully
                data:
                  id: 050de558-2ec7-401f-8bc3-911ebecb6202
                  title: Laptop upgrade for design team
                  description: >-
                    Replace aging laptops for the design team with newer models
                    to keep design tools performant.
                  department: Engineering
                  requesterName: Olu Smith
                  status: SUBMITTED
                  createdAt: '2026-08-06T14:56:36.552Z'
                  updatedAt: '2026-08-06T14:56:36.552Z'
                  comments: []
                  activities: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Requests]
      summary: List requests
      description: Paginated list with an optional status filter.
      operationId: listRequests
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: Paginated list of requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRequestsResponse'
              example:
                statusCode: 200
                message: Operation completed successfully
                data:
                  data:
                    - id: 050de558-2ec7-401f-8bc3-911ebecb6202
                      title: Laptop upgrade for design team
                      description: >-
                        Replace aging laptops for the design team with newer
                        models to keep design tools performant.
                      department: Engineering
                      requesterName: Olu Smith
                      status: SUBMITTED
                      createdAt: '2026-08-06T14:56:36.552Z'
                      updatedAt: '2026-08-06T14:56:36.552Z'
                      comments: []
                      activities: []
                  page: 1
                  pageSize: 10
                  total: 1
                  totalPages: 1
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/requests/{id}:
    get:
      tags: [Requests]
      summary: Retrieve a request
      description: Returns the request with its comments and activity history.
      operationId: getRequestById
      parameters:
