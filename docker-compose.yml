# Local PostgreSQL service backing the Prisma data layer.
services:
  postgres:
    image: postgres:16-alpine
    container_name: approval-workflow-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: approval
      POSTGRES_PASSWORD: approval
      POSTGRES_DB: approval_workflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U approval -d approval_workflow']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
